<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080d18" />
    <title>Sem conexão | VIEIRA SYSTEMS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #080d18;
        color: #eef3fc;
        font:
          16px/1.7 system-ui,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 520px;
      }
      img {
        width: 80px;
        height: 80px;
        object-fit: contain;
      }
      h1 {
        font-size: 36px;
        line-height: 1.2;
      }
      p {
        color: #b6c5dc;
      }
      a {
        display: inline-flex;
        margin-top: 16px;
        color: #080d18;
        background: #66d7ec;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 650;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/vs-192.png"
        alt="VIEIRA SYSTEMS"
        width="80"
        height="80"
      />
      <h1>Vamos reconectar.</h1>
      <p>
        A conexão está indisponível. Verifique sua rede e tente abrir o site
        novamente. Pedidos de orçamento precisam de conexão para serem enviados.
      </p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
